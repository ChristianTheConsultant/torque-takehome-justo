spec_version: 2

description: |
  Simple Torque environment that provisions a Google Cloud Storage bucket via
  a Terraform grain. Demonstrates Torque's IaC orchestration model end-to-end:
  connected repo -> Terraform module discovered as a grain -> blueprint
  composes the grain with inputs and exposes outputs to the environment UI.

inputs:

  agent:
    type: agent
    default: gke-demo-prod
    description: Torque K8s agent that will execute the Terraform grain.

  gcp_project_id:
    type: string
    description: GCP project ID where the bucket will be created.

  gcp_region:
    type: string
    default: us-central1
    description: GCP region used as the bucket location.

  bucket_name_prefix:
    type: string
    default: torque-demo
    description: |
      Prefix for the bucket name. The Terraform module appends an 8-character
      random hex suffix to ensure global uniqueness across launches.

  k8s_namespace:
    type: string
    default: torque-sandboxes
    description: |
      Kubernetes namespace into which the Helm grain deploys its ConfigMap.
      Defaults to 'torque-sandboxes', the gke-demo-prod agent's own namespace,
      where its runner service account (gke-sa) can manage the Secrets Helm
      uses for release records. Another namespace needs a RoleBinding for
      that service account first.

grains:

  gcs_bucket:
    kind: terraform
    spec:
      source:
        # 'store' is the friendly name of the connected repo in Torque.
        # Update if you connect this repo under a different name.
        store: torque-takehome-justo
        path: terraform/gcs-bucket-sample

      agent:
        name: '{{ .inputs.agent }}'

      # No credentials are passed: the runner pod authenticates to GCP as the
      # agent's Kubernetes service account through GKE Workload Identity, and
      # the Google provider picks that up as Application Default Credentials.
      # GOOGLE_PROJECT is a convenience for the provider's default project.
      env-vars:
        - GOOGLE_PROJECT: '{{ .inputs.gcp_project_id }}'

      inputs:
        - project_id: '{{ .inputs.gcp_project_id }}'
        - region: '{{ .inputs.gcp_region }}'
        - bucket_name_prefix: '{{ .inputs.bucket_name_prefix }}'
        - force_destroy: 'true'

      outputs:
        - bucket_name
        - bucket_url
        - bucket_self_link
        - bucket_location

  # Second grain: a Helm chart that deploys a ConfigMap into the same GKE
  # cluster the Torque agent is running on. It reads the bucket outputs from
  # the Terraform grain above and stamps them into the ConfigMap data, which
  # demonstrates two Torque features at once:
  #   1) Grain composition across different IaC kinds (terraform + helm)
  #   2) Cross-grain output passing via {{ .grains.X.outputs.Y }}
  # Explicit depends-on tells Torque the Helm grain must wait for the
  # Terraform grain to complete and emit outputs before its own input
  # references are resolved.
  bucket_info_helm:
    kind: helm
    depends-on: gcs_bucket
    spec:
      source:
        store: torque-takehome-justo
        path: helm/bucket-info

      agent:
        name: '{{ .inputs.agent }}'

      target-namespace: '{{ .inputs.k8s_namespace }}'

      inputs:
        - gcsBucket: '{{ .grains.gcs_bucket.outputs.bucket_name }}'
        - gcsBucketUrl: '{{ .grains.gcs_bucket.outputs.bucket_url }}'
        - gcsBucketLocation: '{{ .grains.gcs_bucket.outputs.bucket_location }}'
        - environmentName: '{{ envid | downcase }}'

outputs:

  bucket_name:
    value: '{{ .grains.gcs_bucket.outputs.bucket_name }}'

  bucket_url:
    value: '{{ .grains.gcs_bucket.outputs.bucket_url }}'

  bucket_self_link:
    value: '{{ .grains.gcs_bucket.outputs.bucket_self_link }}'

  bucket_location:
    value: '{{ .grains.gcs_bucket.outputs.bucket_location }}'
